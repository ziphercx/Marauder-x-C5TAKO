[platformio]
src_dir = esp32_marauder
default_envs = c5tako
lib_dir = pio-libraries
test_dir = test

[env:c5tako]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11-libs.tar.xz
board = esp32-c5-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.filesystem = spiffs
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<libraries/>
build_flags =
  -DMARAUDER_C5TAKO
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSER_SETUP_LOADED=1
  -include $PROJECT_DIR/User_Setup_c5tako.h
  -fno-exceptions
  -Wl,-zmuldefs
lib_deps =
  https://github.com/bblanchon/ArduinoJson.git#v6.18.2
  https://github.com/h2zero/NimBLE-Arduino.git#2.5.1
  https://github.com/ESP32Async/AsyncTCP.git#v3.4.8
  https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.8.1
  https://github.com/marian-craciunescu/ESP32Ping.git#1.6
  https://github.com/stevemarple/MicroNMEA.git#v2.0.6
  https://github.com/plerup/espsoftwareserial.git#8.1.0
  https://github.com/ivanseidel/LinkedList.git#v1.3.3
extra_scripts = post:tools/merge_c5tako.py

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = true
extra_scripts =
  pre:tools/native_coverage.py
build_src_filter =
  -<*>
  +<MarauderMacAddress.cpp>
  +<PcapHeader.cpp>
  +<Switches.cpp>
  +<DisplayLine.cpp>
  +<BeaconFrame.cpp>
  +<WdgResponse.cpp>
  +<FoxHuntTarget.cpp>
  +<TargetListSort.cpp>
  +<TDongleStats.cpp>
  +<IPv4Range.cpp>
  +<FirmwareMetadata.cpp>
  +<MenuMarquee.cpp>
  +<GpsTrackerStats.cpp>
  +<BootSplash.cpp>
  +<MenuInputRepeat.cpp>
  +<TDongleBus.cpp>
  +<RemoteIdModel.cpp>
  +<RemoteIdDecoder.cpp>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic
  --coverage
  -Itest/support
